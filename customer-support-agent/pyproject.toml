[project]
name = "customer-support-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AbdelrahmanElatrash", email = "a.elatrash170@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncio>=4.0.0",
    "bedrock-agentcore>=1.22.0",
    "bedrock-agentcore-starter-toolkit>=0.3.12",
    "chardet>=7.6.0",
    "nest-asyncio>=1.6.0",
    "playwright>=1.62.0",
    "strands-agents>=1.55.0",
    "strands-agents-tools>=0.8.8",
    "urllib3>=2.7.0",
]

[project.scripts]
customer-support-agent = "customer_support_agent:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
